<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta name="copyright" content="© 2026 Collabor8r. All rights reserved.">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Collabor8r — project suite for teams</title>
  <meta name="description" content="Collabor8r is a project suite for teams: issues, boards, backlogs, wiki, reports, service desk and forms in one place — light and dark, fully animated." />
  <meta name="theme-color" content="#f3efe8" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Collabor8r — project suite for teams" />
  <meta property="og:description" content="Issues, boards, wiki, reports and service desk in one warm, animated workspace." />
  <script>
    (function (d) {
      d.classList.add('js');
      try {
        var t = JSON.parse(localStorage.getItem('hearth:theme') || '"light"');
        d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        if (localStorage.getItem('hearth:mini') === '1') d.classList.add('side-mini');
        var dn = localStorage.getItem('hearth:density');
        if (dn === 'compact') d.dataset.density = 'compact';
      } catch (e) {}
      setTimeout(function () { d.classList.add('failsafe'); }, 4000);
    })(document.documentElement);
  </script>
  <style>
    #root { display: contents; }
  </style>
  <link rel="icon" href="/collabor8r.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png"> <!-- iOS requires a PNG here; webp/ico are not accepted for home-screen icons -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
